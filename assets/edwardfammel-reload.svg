<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Edward — Backend, infrastructure and the Dark Hour</title>
  <desc id="desc">Original burgundy, crimson, ivory and black geometric banner inspired by Mitsuru Kirijo and Persona 3 Reload menu aesthetics. A rotating clock surrounds a moon on the right.</desc>
  <defs>
    <linearGradient id="crimson" x2="1" y2="1"><stop stop-color="#5c1026"/><stop offset="1" stop-color="#b32846"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ebbdc6" stroke-opacity=".12"/></pattern>
    <clipPath id="frame"><path d="M0 0H1280V400H0Z"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="#140d14" d="M0 0H1280V400H0Z"/>
    <path fill="url(#crimson)" d="M0 0H1040L750 400H0Z"/>
    <path fill="url(#grid)" d="M0 0H1280V400H0Z"/>
    <path fill="#f0d7bd" d="M1035 0H1050L760 400H745Z"/>
    <path fill="#310f1c" d="M0 316L665 274L580 400H0Z"/>
    <path fill="#b32846" d="M0 0H1280V7H0Z"/>
    <g fill="#f4e9e3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">
      <text x="64" y="354">BACKEND · INFRASTRUCTURE · HOMELAB</text>
    </g>
    <g transform="translate(58 0) skewX(-9)" font-family="Arial, Helvetica, sans-serif" font-weight="900">
      <text x="0" y="225" fill="#fff" font-size="126" letter-spacing="-5">Edward</text>
    </g>
    <g transform="translate(1052 196)">
      <circle r="128" fill="none" stroke="#773045" stroke-width="1"/>
      <circle r="110" fill="none" stroke="#d99caa" stroke-width="2" stroke-dasharray="2 12"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
        <path d="M0-139V-119M139 0H119M0 139V119M-139 0H-119" stroke="#f4e9e3" stroke-width="3"/>
        <path d="M0 0L-34-67" stroke="#cf4d69" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle r="70" fill="#331322"/>
      <path d="M29-63A70 70 0 1 0 29 63A79 79 0 0 1 29-63Z" fill="#fff3e8"/>
      <circle cx="91" cy="-82" r="4" fill="#fff">
        <animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="1052" y="365" text-anchor="middle" fill="#e5bac3" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">THE DARK HOUR</text>
    <path d="M64 379H208" stroke="#cba881" stroke-width="3"/>
  </g>
</svg>
